[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-print"
version = "0.1.0"
description = "Extract the content area of PDF pages and re-pack it onto fewer sheets of paper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
eco-print = "eco_print.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
