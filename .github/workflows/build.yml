name: Build executables

# Cross-platform packaging (UC-09). PyInstaller does not cross-compile, so
# each OS builds and smoke-tests its own executable in parallel; there is no
# single "build everything" job to run instead of this matrix.
#
# Unsigned builds: no code-signing or notarization step. Users will see a
# one-time "unknown developer" warning on macOS and Windows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: eco-print-macos
          - os: windows-latest
            artifact-name: eco-print-windows
          - os: ubuntu-latest
            artifact-name: eco-print-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eco-print and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build
        working-directory: packaging
        run: pyinstaller --noconfirm eco-print.spec

      - name: Smoke test the built executable
        working-directory: packaging
        run: python smoke_test.py

      # macOS only: `dist/` holds both the finished eco-print.app and the
      # loose dist/eco-print/ onedir folder BUNDLE was built from -- the
      # latter is intermediate build output, not something to ship, and
      # uploading it too would silently double the artifact for no reason.
      # The .app is archived with `ditto` rather than left as a raw
      # directory for actions/upload-artifact to zip itself: PyInstaller's
      # macOS bundle uses symlinks between Contents/Frameworks and
      # Contents/Resources to avoid storing the same libraries twice on
      # disk, and upload-artifact's zip step does not preserve them --
      # it was found to materialize each symlink as a full real copy,
      # roughly doubling the bundle's size on its own. `ditto` is Apple's
      # own tool for archiving .app bundles and preserves them correctly.
      - name: Archive the .app bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: packaging/dist
        run: ditto -c -k --sequesterRsrc --keepParent eco-print.app eco-print-macos.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact-name }}
          path: packaging/dist/eco-print-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: ${{ matrix.artifact-name }}
          path: packaging/dist/eco-print/*
          if-no-files-found: error
